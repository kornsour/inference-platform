# ScaledObject that scales vLLM via the CUSTOM external scaler (one composite trigger).
# This is the DEFAULT scaling path — the one bootstrap/platform.sh's autoscaling() layer
# and gitops/applications.yaml's inference-scaler Application actually deploy/sync. Apply
# this OR the built-in-scaler version (gpu-node/keda-scaledobject-gpu.yaml) — only one
# ScaledObject may target a given Deployment.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-qwen
  namespace: inference
spec:
  scaleTargetRef:
    name: vllm-qwen
  minReplicaCount: 1
  maxReplicaCount: 2           # two physical GPUs — matches gpu-node/keda-scaledobject-gpu.yaml
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
    - type: external
      metadata:
        scalerAddress: inference-scaler.inference.svc:6000
        # Prometheus via the laptop NODE IP (hostNetwork Prometheus, :9090) — cross-node
        # ClusterIP is down under WSL2 mirrored mode (see docs/cluster-troubleshooting-log.md).
        prometheusAddress: http://192.168.18.142:9090
        queueThreshold: "3"
        kvCacheThreshold: "0.7"
        activationThreshold: "1"
