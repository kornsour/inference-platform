# GitOps — Argo CD Applications that declaratively sync the inference platform to the
# cluster. This is the CD half of the GitOps/CI checklist item (CI lints+validates+builds;
# Argo CD continuously reconciles desired state from git).
#
# Apply with Argo CD installed: `kubectl apply -f gitops/applications.yaml`.
# NOTE: each Application uses a directory `include` filter so only the *canonical* manifests
# sync — gpu-node/ also holds alternatives (vllm-plain.yaml, kserve-inferenceservice.yaml,
# keda-scaledobject-gpu.yaml) that intentionally aren't part of the synced desired state.
#
# Scaling path: the custom Go external scaler (keda-inference-scaler/) is the default —
# its composite queue-depth+KV-cache trigger is a stronger story than two independent
# built-in Prometheus triggers. keda-scaledobject-gpu.yaml is the built-in-scaler
# alternative, kept for reference/rollback but excluded from the include filter below —
# only one ScaledObject may target the vllm-qwen Deployment.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference-serving
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kornsour/inference-platform
    targetRevision: main
    path: phase-2-capstone/gpu-node
    directory:
      include: "{vllm-2gpu.yaml,observability.yaml,slo-prometheusrule.yaml}"
      # keda-scaledobject-gpu.yaml (built-in-scaler alternative) intentionally excluded —
      # the ScaledObject is synced by the inference-scaler Application below instead.
  destination:
    server: https://kubernetes.default.svc
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference-scaler
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kornsour/inference-platform
    targetRevision: main
    path: phase-2-capstone/keda-inference-scaler/deploy
    directory:
      # scaler.yaml: the external scaler Deployment/Service. scaledobject-external.yaml:
      # the ScaledObject wired to it — the default scaling path (see note above).
      include: "{scaler.yaml,scaledobject-external.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
