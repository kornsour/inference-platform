site_name: Inference Platform
site_description: >-
  An autoscaling LLM inference platform on Kubernetes — KEDA scaling on
  request-queue depth and KV-cache utilization via a custom Go external scaler,
  validated on a DIY two-GPU cluster with real vLLM serving.
site_author: kornsour
site_url: https://kornsour.github.io/inference-platform/

repo_name: kornsour/inference-platform
repo_url: https://github.com/kornsour/inference-platform
edit_uri: edit/main/

# Use the repo root as the docs directory so README.md is the homepage and the
# existing docs/ and phase-*/ markdown render in place (mkdocs-same-dir plugin
# lifts the usual "docs_dir == project dir" restriction).
docs_dir: .
site_dir: site

theme:
  name: material
  icon:
    logo: material/memory
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

plugins:
  - search
  - same-dir

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# `--strict` alone does not check that links resolve, which is how several
# directory-style links shipped 404ing on Pages. With these set to `warn`,
# `--strict` promotes them to build failures, so CI catches the next one.
validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Glossary: docs/glossary.md
  - Resources: docs/resources.md
  - Phase 1 — Foundations:
      - Overview: phase-1-foundations/README.md
      - Serve Locally: phase-1-foundations/serve-local.md
      - Results: phase-1-foundations/results.md
      - Brief: phase-1-foundations/brief.md
  - Phase 2 — Capstone:
      - Overview: phase-2-capstone/README.md
      - Local validation (mock vLLM): phase-2-capstone/local/README.md
      - DIY GPU cluster:
          - Why local GPUs: phase-2-capstone/gpu-node/README.md
          - Runbook (all machines): phase-2-capstone/gpu-node/diy-cluster.md
          - Node — Windows PC (k3s server): docs/cluster-node-windows-pc.md
          - Node — KAISER-LAPTOP (k3s agent): docs/cluster-node-kaiser-laptop.md
          - Cross-node networking: docs/cluster-cross-node-networking.md
          - Troubleshooting log (case study): docs/cluster-troubleshooting-log.md
      - Real-GPU results: phase-2-capstone/gpu-node/real-gpu-results.md
      - Architecture decisions & trade-offs: phase-2-capstone/architecture-decisions.md
      - Tech stack & trade-offs: phase-2-capstone/tech-stack.md
      - Custom KEDA scaler (Go): phase-2-capstone/keda-inference-scaler/README.md
      - Autoscaling signal staleness: docs/autoscaling-signal-staleness.md
      - GitOps & CI: gitops/README.md
      - Bootstrap (spin up / tear down): bootstrap/README.md
      - Runbook (operate the cluster): phase-2-capstone/runbook.md
      - Write-up: phase-2-capstone/WRITEUP.md

# README.md is excluded because index.md is the intended public homepage
# (docs_dir is the repo root, so both would otherwise render). The template
# files are working scaffolds, not published content.
exclude_docs: |
  /README.md
  /phase-2-capstone/oss-contribution.md
  /phase-2-capstone/WRITEUP-template.md
  /phase-2-capstone/runbook-template.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kornsour/inference-platform
