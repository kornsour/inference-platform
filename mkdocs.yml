site_name: AI Inference
site_description: >-
  A self-directed program to build hands-on depth in LLM inference serving —
  GPU scheduling, serving engines, inference-aware autoscaling, and the
  observability and economics of running models at scale.
site_author: kornsour
site_url: https://kornsour.github.io/ai-inference/

repo_name: kornsour/ai-inference
repo_url: https://github.com/kornsour/ai-inference
edit_uri: edit/main/

# Use the repo root as the docs directory so README.md is the homepage and the
# existing docs/ and phase-*/ markdown render in place (mkdocs-same-dir plugin
# lifts the usual "docs_dir == project dir" restriction).
docs_dir: .
site_dir: site

theme:
  name: material
  icon:
    logo: material/memory
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

plugins:
  - search
  - same-dir

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Glossary: docs/glossary.md
  - Resources: docs/resources.md
  - Phase 1 — Foundations:
      - Overview: phase-1-foundations/README.md
      - Serve Locally: phase-1-foundations/serve-local.md
      - Results: phase-1-foundations/results.md
      - Brief: phase-1-foundations/brief.md
  - Phase 2 — Capstone:
      - Overview: phase-2-capstone/README.md
      - Local validation (mock vLLM): phase-2-capstone/local/README.md
      - DIY GPU cluster:
          - Why local GPUs: phase-2-capstone/gpu-node/README.md
          - Runbook (all machines): phase-2-capstone/gpu-node/diy-cluster.md
          - Node — Windows PC (k3s server): docs/cluster-node-windows-pc.md
          - Node — KAISER-LAPTOP (k3s agent): docs/cluster-node-kaiser-laptop.md
          - Cross-node networking: docs/cluster-cross-node-networking.md
          - Troubleshooting log (case study): docs/cluster-troubleshooting-log.md
      - Real-GPU results: phase-2-capstone/gpu-node/real-gpu-results.md
      - Write-up: phase-2-capstone/WRITEUP.md
      - Templates:
          - Write-up template: phase-2-capstone/WRITEUP-template.md
          - Runbook template: phase-2-capstone/runbook-template.md

# Keep private career-strategy material out of the published site entirely
# (not just unlinked from the nav). README.md is excluded because it carries the
# candid gap analysis / role targeting; the public homepage is index.md.
exclude_docs: |
  /README.md
  /docs/project-plan.md
  /docs/role-comparison.md
  /docs/role.md
  /phase-3-positioning/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kornsour/ai-inference
